{{define "page-forgot"}}{{template "head" .}}
<div class="row justify-content-center">
  <div class="col-sm-8 col-md-5 col-lg-4">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="h5 mb-3">Lupa kata sandi</h1>
        {{if not .Success}}
        <form action="/forgot-password" method="post">
          <div class="mb-3">
            <label class="form-label" for="identity">Username atau email</label>
            <input class="form-control" id="identity" name="identity" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="nama">Nama lengkap</label>
            <input class="form-control" id="nama" name="nama" required>
            <div class="form-text">Kedua kolom harus menunjuk ke akun yang sama.</div>
          </div>
          <button class="btn btn-primary w-100" type="submit"><i class="bi bi-send me-2" aria-hidden="true"></i>Kirim permintaan</button>
        </form>
        {{end}}
        <div class="mt-3">
          <a href="/login">Masuk</a>
        </div>
      </div>
    </div>
  </div>
</div>
{{template "foot" .}}{{end}}
