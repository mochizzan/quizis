{{define "page-forgot"}}{{template "head" .}}
<div class="row justify-content-center">
  <div class="col-sm-8 col-md-5 col-lg-4">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="h5 mb-3">Forgot password</h1>
        {{if not .Success}}
        <form action="/forgot-password" method="post">
          <div class="mb-3">
            <label class="form-label" for="identity">Username or email</label>
            <input class="form-control" id="identity" name="identity" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="nama">Full name</label>
            <input class="form-control" id="nama" name="nama" required>
            <div class="form-text">Both fields must match the same account.</div>
          </div>
          <button class="btn btn-primary w-100" type="submit"><i class="bi bi-send me-2" aria-hidden="true"></i>Submit request</button>
        </form>
        {{end}}
        <div class="mt-3">
          <a href="/login">Sign in</a>
        </div>
      </div>
    </div>
  </div>
</div>
{{template "foot" .}}{{end}}
