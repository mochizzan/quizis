{{define "page-change-password"}}{{template "head" .}}
<div class="row justify-content-center">
  <div class="col-sm-8 col-md-5 col-lg-4">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="h5 mb-3">Change password</h1>
        <p class="text-body-secondary">You must set a new password before continuing.</p>
        <form action="/change-password" method="post">
          <div class="mb-3">
            <label class="form-label" for="password">New password</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="confirm">Confirm new password</label>
            <input class="form-control" id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required>
          </div>
          <button class="btn btn-primary w-100" type="submit"><i class="bi bi-key me-2" aria-hidden="true"></i>Set password</button>
        </form>
        <div class="mt-3">
          <a href="/logout">Sign out</a>
        </div>
      </div>
    </div>
  </div>
</div>
{{template "foot" .}}{{end}}
