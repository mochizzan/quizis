{{define "page-teacher-quiz-new"}}{{template "app_head" .}}
<h1 class="h4 mb-3">Kuis baru</h1>
<div class="card">
  <div class="card-body">
    <form action="/teacher/quiz/new" method="post" data-fetch data-success="Kuis &quot;{judul}&quot; berhasil dibuat." data-next="/teacher/quiz/" data-next-id="id">
      {{template "settings-fields" .}}
      <div class="mt-3 d-flex gap-2">
        <button class="btn btn-primary" type="submit"><i class="bi bi-plus-lg me-2" aria-hidden="true"></i>Buat kuis</button>
        <a class="btn btn-outline-secondary" href="/teacher/quiz"><i class="bi bi-x-lg me-2" aria-hidden="true"></i>Batal</a>
      </div>
    </form>
  </div>
</div>
<script src="{{asset "/js/teacher.js"}}"></script>
{{template "app_foot" .}}{{end}}
