{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{with .Title}}{{.}} — {{end}}Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Cypro+Minoan&display=swap">
<link rel="stylesheet" href="{{asset "/bootstrap/css/bootstrap.min.css"}}">
<link rel="stylesheet" href="{{asset "/assets/bootstrap-icons/bootstrap-icons.css"}}">
<link rel="stylesheet" href="{{asset "/assets/theme.css"}}">
<link rel="stylesheet" href="{{asset "/css/app.css"}}">
<script>try{var t=localStorage.getItem("theme");if(t){document.documentElement.setAttribute("data-bs-theme",t);}}catch(e){}</script>
<script src="{{asset "/js/theme.js"}}" defer></script>
<script src="{{asset "/js/ui.js"}}" defer></script>
</head>
<body>
{{- /* Minimal chrome (auth, quiz workspace, state pages): brand + theme
       only — no navigation menus, so no role's links can leak here. */}}
{{template "feedback-toasts" .}}
<header class="navbar border-bottom">
  <div class="container-fluid">
    <a class="navbar-brand fw-semibold d-inline-flex align-items-center gap-2" href="/"><span class="brand-mark">Q</span>Quiz</a>
    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
      <li class="nav-item">
        <button type="button" class="btn btn-sm btn-outline-secondary" data-theme-toggle
                title="Toggle theme" aria-label="Toggle theme"
                data-bs-toggle="tooltip" data-bs-placement="bottom"><i class="bi bi-circle-half" aria-hidden="true"></i></button>
      </li>
    </ul>
  </div>
</header>
<main class="container py-4">
{{end}}
