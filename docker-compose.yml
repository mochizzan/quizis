services:
  app:
    build: .
    image: ghcr.io/mochizzan/quizis:latest
    ports: ["8090:8090"]
    # Runtime config — the image carries no .env (dockerignored), so compose
    # POINTS AT the host's files here: template first, the host's .env second
    # (a later env_file wins). Every value change happens in .env alone →
    # `docker compose up -d app`, no compose edit, no rebuild. Local and
    # production hosts each supply their own .env behind the same image.
    env_file:
      - path: .env.example
        required: false
      - path: .env
        required: false
    environment:
      # The only value NOT from .env: DB_HOST is deliberately absent there
      # (local `go run` uses the 127.0.0.1 default; Docker needs `db`).
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/uploads:/app/data/uploads
    restart: unless-stopped

  db:
    image: mariadb:12
    environment:
      MARIADB_DATABASE:      ${DB_NAME:-quiz}
      MARIADB_USER:          ${DB_USER:-quiz}
      MARIADB_PASSWORD:      ${DB_PASS:-quizpass}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:-rootpass}
    ports: ["3306:3306"]
    volumes:
      - ./data/mariadb:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
